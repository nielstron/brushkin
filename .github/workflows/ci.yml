name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Build
        run: ./gradlew :app:assembleRelease
      - name: No Google Play services / ML Kit / Firebase code in the APK
        run: |
          unzip -o -q app/build/outputs/apk/release/*.apk 'classes*.dex' -d dex
          if strings dex/*.dex | grep -qiE 'com/google/android/gms|com/google/android/play|com/google/mlkit|firebase'; then
            echo "Non-free code found in the APK"; exit 1
          fi
