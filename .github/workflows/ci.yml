name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testFossDebugUnitTest :app:testFullDebugUnitTest
      - name: Build both flavors
        run: ./gradlew :app:assembleFossRelease :app:assembleFullRelease
      - name: The FOSS build contains no Google Play services / ML Kit code
        run: |
          unzip -o -q app/build/outputs/apk/foss/release/*.apk 'classes*.dex' -d foss-dex
          if strings foss-dex/*.dex | grep -qiE 'com/google/android/gms|com/google/mlkit|firebase'; then
            echo "Non-free code found in the FOSS APK"; exit 1
          fi
