name: Release

# Push a tag like v0.2.0 (matching versionName in app/build.gradle.kts) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep JDK 21: F-Droid rebuilds the APK with JDK 21 and only publishes our signed
      # APK if its build is byte-identical (reproducible builds); another JDK changes classes.dex.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check the tag matches the app version
        run: |
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != versionName $v"; exit 1; }
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BRUSHKIN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed APKs
        env:
          BRUSHKIN_KEYSTORE: ${{ runner.temp }}/release.jks
          BRUSHKIN_KEYSTORE_PASSWORD: ${{ secrets.BRUSHKIN_KEYSTORE_PASSWORD }}
          BRUSHKIN_KEY_ALIAS: ${{ secrets.BRUSHKIN_KEY_ALIAS }}
          BRUSHKIN_KEY_PASSWORD: ${{ secrets.BRUSHKIN_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "brushkin-$v.apk"
          notes=fastlane/metadata/android/en-US/changelogs/$code.txt
          gh release create "$GITHUB_REF_NAME" "brushkin-$v.apk" \
            --title "Brushkin $v" --notes-file "$( [ -f "$notes" ] && echo "$notes" || echo /dev/null )"
